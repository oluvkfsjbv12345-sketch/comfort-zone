name: Build Flutter APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p extracted_project
          unzip -q comfort_zone_flutter.zip -d extracted_project
          ls -la extracted_project

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Find Project Directory and Build
        run: |
          cd extracted_project
          # Automatically find the directory containing pubspec.yaml
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 3 | xargs dirname)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            extracted_project/**/build/app/outputs/flutter-apk/app-release.apk
