name: Build Flutter APK from Zip

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "Listing root files:"
          ls -la
          
          # Find the zip file
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project
          else
            echo "Error: No zip file found!"
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Dependencies & Build APK
        run: |
          # Locate pubspec.yaml inside extracted files
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 3 | xargs dirname | head -n 1)
          
          if [ -n "$PROJECT_DIR" ]; then
            echo "Found Flutter project at: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            flutter pub get
            flutter build apk --release
          else
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
